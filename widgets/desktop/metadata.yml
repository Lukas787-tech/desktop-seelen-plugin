id: "@ralfm/desktop"
icon: PiDesktopTowerDuotone
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
  tags:
    - desktop
    - launcher
    - widgets

loader: ThirdParty
preset: Desktop
instances: ReplicaByMonitor
lazy: false

# The wallpaper layer decodes video; keep it on the GPU regardless of the
# user's global hardware-acceleration preference.
forceHardwareAcceleration: true

html: !include index.html
js: !include index.js
css: !include index.css

shortcuts:
  # Windows' own Win+D raises Explorer's desktop over this surface, which then
  # has to climb back over it (see `src/lib/desktoplayer.svelte.ts`). This
  # reveals the desktop by minimising the windows instead, which never moves
  # Explorer's desktop at all.
  - id: show-desktop
    command: ["widget", "trigger", "@ralfm/desktop"]
    label: Show the desktop
    defaultKeys: ["Win", "Shift", "D"]

  # Both of these run the same CLI command, because `widget trigger` is the only
  # one that reaches a widget and it takes no arguments. Which of them fired is
  # worked out from which key is still down when the trigger lands - see
  # `src/lib/hotkeys.ts`, which says plainly what happens when that is unclear.
  - id: game-mode
    command: ["widget", "trigger", "@ralfm/desktop"]
    label: Open game mode
    description: >-
      Turns the chosen display's desktop into the console launcher, and turns it
      back. Rebind it here; there is nothing to set in the widget for it.
    defaultKeys: ["Win", "Shift", "G"]

settings:
  - group:
      label: Layout
      description: How icons and module panels are placed on the surface.
      items:
        - type: range
          key: gridSize
          label: Grid cell size
          min: 48
          max: 200
          step: 4
          defaultValue: 96
          allowSetByMonitor: true
        - type: switch
          key: snapToGrid
          label: Snap to grid
          description: Turn off for pixel-precise placement.
          defaultValue: true
          allowSetByMonitor: true
        - type: switch
          key: lockLayout
          label: Lock layout
          description: Prevents dragging icons and panels.
          defaultValue: false
          allowSetByMonitor: true
        - type: range
          key: iconSize
          label: Icon size
          min: 24
          max: 128
          step: 4
          defaultValue: 48
          allowSetByMonitor: true
        - type: select
          key: labelMode
          label: Icon labels
          options:
            - label: Always
              value: always
            - label: On hover
              value: hover
            - label: Never
              value: never
          defaultValue: always
          allowSetByMonitor: true
  - group:
      label: Typography
      description: >-
        Leave a font empty to inherit whatever the active Seelen theme sets.
        Everything on the surface is sized from the base size, so moving it
        moves the whole surface rather than one label.
      items:
        - type: font
          key: fontFamily
          label: Interface font
          description: Used for every label, row and menu on the surface.
          defaultValue: ""
          allowSetByMonitor: true
        - type: font
          key: displayFont
          label: Display font
          description: The clock, the timer and panel titles only. Leave empty to use the interface font.
          defaultValue: ""
          allowSetByMonitor: true
        - type: font
          key: monoFont
          label: Monospace font
          description: Code in the assistant, game paths and other fixed-pitch text. Leave empty for Cascadia Code or Consolas.
          defaultValue: ""
          allowSetByMonitor: true
        - type: range
          key: fontSize
          label: Base text size
          min: 10
          max: 18
          step: 1
          defaultValue: 14
          allowSetByMonitor: true
        - type: range
          key: fontWeight
          label: Text weight
          min: 300
          max: 700
          step: 100
          defaultValue: 400
          allowSetByMonitor: true
        - type: range
          key: displayWeight
          label: Big number weight
          description: The clock, the timer and every other large figure. 100 is hairline, 900 is black.
          min: 100
          max: 900
          step: 100
          defaultValue: 200
          allowSetByMonitor: true
        - type: range
          key: letterSpacing
          label: Letter spacing
          description: In hundredths of the text size.
          min: -4
          max: 12
          step: 1
          defaultValue: 0
          allowSetByMonitor: true
        - type: switch
          key: textShadow
          label: Text shadow
          description: A soft shadow under all panel text, for clear or very transparent panels.
          defaultValue: false
          allowSetByMonitor: true
        - type: select
          key: titleStyle
          label: Panel titles
          options:
            - label: Small caps
              value: caps
            - label: Plain
              value: plain
            - label: Lowercase
              value: lower
            - label: Hidden
              value: hidden
          defaultValue: caps
          allowSetByMonitor: true
        - type: select
          key: titleDecor
          label: Title decoration
          options:
            - label: None
              value: none
            - label: Brackets
              value: bracket
            - label: Underline
              value: underline
            - label: Tab
              value: tab
            - label: Title bar
              value: bar
            - label: Accent dot
              value: dot
          defaultValue: none
          allowSetByMonitor: true
        - type: select
          key: titleAlign
          label: Title alignment
          options:
            - label: Left
              value: left
            - label: Centre
              value: center
            - label: Right
              value: right
          defaultValue: left
          allowSetByMonitor: true
        - type: range
          key: titleWeight
          label: Title weight
          min: 300
          max: 900
          step: 100
          defaultValue: 600
          allowSetByMonitor: true

  - group:
      label: Colour
      description: >-
        A colour scheme recolours every panel, menu and module at once, the way
        a base16 theme recolours a Linux desktop. Follow Seelen theme leaves
        colour to the active theme's preset. Right-click the desktop for Look
        and Colour scheme menus that switch in one click.
      items:
        - type: select
          key: colorScheme
          label: Colour scheme
          options:
            - label: Follow Seelen theme
              value: theme
            - label: Custom colours
              value: custom
            - label: Catppuccin Mocha
              value: catppuccin-mocha
            - label: Catppuccin Latte
              value: catppuccin-latte
            - label: Nord
              value: nord
            - label: Gruvbox Dark
              value: gruvbox-dark
            - label: Gruvbox Light
              value: gruvbox-light
            - label: Dracula
              value: dracula
            - label: Tokyo Night
              value: tokyo-night
            - label: Rosé Pine
              value: rose-pine
            - label: Rosé Pine Dawn
              value: rose-pine-dawn
            - label: Everforest
              value: everforest
            - label: Kanagawa
              value: kanagawa
            - label: One Dark
              value: one-dark
            - label: Solarized Dark
              value: solarized-dark
            - label: Solarized Light
              value: solarized-light
            - label: Monokai
              value: monokai
            - label: "Synthwave '84"
              value: synthwave
            - label: Catppuccin Frappé
              value: catppuccin-frappe
            - label: Catppuccin Macchiato
              value: catppuccin-macchiato
            - label: Rosé Pine Moon
              value: rose-pine-moon
            - label: Gruvbox Material
              value: gruvbox-material
            - label: Everforest Light
              value: everforest-light
            - label: Tokyo Night Day
              value: tokyo-day
            - label: GitHub Dark
              value: github-dark
            - label: GitHub Light
              value: github-light
            - label: Ayu Dark
              value: ayu-dark
            - label: Ayu Mirage
              value: ayu-mirage
            - label: Ayu Light
              value: ayu-light
            - label: Night Owl
              value: night-owl
            - label: Palenight
              value: palenight
            - label: Oxocarbon
              value: oxocarbon
            - label: Horizon
              value: horizon
            - label: Nightfox
              value: nightfox
            - label: Moonlight
              value: moonlight
            - label: Poimandres
              value: poimandres
            - label: Cobalt2
              value: cobalt2
            - label: Vesper
              value: vesper
          defaultValue: theme
          allowSetByMonitor: true
        - type: switch
          key: followTheme
          label: Follow the active theme
          description: >-
            Takes the panel colour and accent from the Seelen theme you have
            enabled, so a theme preset restyles the surface along with the rest
            of the shell. Only while the colour scheme is Follow Seelen theme;
            turn off to use the tint and accent below instead.
          defaultValue: true
        - type: switch
          key: schemeAccent
          label: Use the scheme's accents
          description: Off, the two accent colours below are used with any scheme.
          defaultValue: true
          allowSetByMonitor: true
        - type: color
          key: schemeGround
          label: Custom ground
          description: The panel colour a Custom colours scheme is mixed from.
          defaultValue: "#1e1e2e"
          allowSetByMonitor: true
        - type: color
          key: schemeInk
          label: Custom ink
          description: The text colour a Custom colours scheme is mixed from.
          defaultValue: "#cdd6f4"
          allowSetByMonitor: true
        - type: color
          key: accentColor
          label: Accent colour
          description: Used when neither the theme nor a scheme is providing one.
          defaultValue: "#7aa2f7"
        - type: color
          key: accentColor2
          label: Second accent
          description: The far end of gradient edges and gradient meters.
          defaultValue: "#bb9af7"
          allowSetByMonitor: true
        - type: range
          key: surfaceHue
          label: Panel tint hue
          description: Ignored while the tint strength below is zero.
          min: 0
          max: 360
          step: 5
          defaultValue: 240
          allowSetByMonitor: true
        - type: range
          key: surfaceChroma
          label: Panel tint strength
          description: Zero leaves the panel neutral. Applied on top of the theme's or the scheme's own colour.
          min: 0
          max: 20
          step: 1
          defaultValue: 0
          allowSetByMonitor: true

  - group:
      label: Panels
      items:
        - type: range
          key: panelOpacity
          label: Panel opacity
          min: 0
          max: 100
          step: 1
          defaultValue: 60
          allowSetByMonitor: true
        - type: range
          key: panelBlur
          label: Panel blur
          min: 0
          max: 48
          step: 1
          defaultValue: 20
          allowSetByMonitor: true
        - type: range
          key: backdropSaturation
          label: Backdrop saturation
          description: Above 100 makes the wallpaper behind the glass more vivid, the way a compositor's vibrancy setting does.
          min: 0
          max: 250
          step: 5
          defaultValue: 100
          allowSetByMonitor: true
        - type: switch
          key: panelTexture
          label: Frosted texture
          description: >-
            The sheen and grain that make a translucent panel read as glass
            rather than as tint. Sent to the shell theme too, where it matters
            more - a dock cannot blur its backdrop, so this is the whole of
            what makes one look frosted.
          defaultValue: true
          allowSetByMonitor: true
        - type: select
          key: panelFill
          label: Panel fill
          options:
            - label: Flat
              value: flat
            - label: Light from above
              value: gradient
            - label: Accent wash
              value: accent
          defaultValue: flat
          allowSetByMonitor: true
        - type: range
          key: cornerRadius
          label: Corner radius
          min: 0
          max: 36
          step: 1
          defaultValue: 16
          allowSetByMonitor: true
        - type: range
          key: panelPadding
          label: Inner padding
          min: 4
          max: 32
          step: 1
          defaultValue: 12
          allowSetByMonitor: true
        - type: range
          key: panelBorderWidth
          label: Edge width
          min: 0
          max: 6
          step: 0.5
          defaultValue: 1
          allowSetByMonitor: true
        - type: select
          key: panelBorderStyle
          label: Edge style
          options:
            - label: Solid
              value: solid
            - label: Dashed
              value: dashed
            - label: Dotted
              value: dotted
            - label: Double
              value: double
            - label: Groove
              value: groove
            - label: Ridge
              value: ridge
            - label: Inset
              value: inset
            - label: Outset (bevel)
              value: outset
          defaultValue: solid
          allowSetByMonitor: true
        - type: select
          key: panelBorderColor
          label: Edge colour
          options:
            - label: Neutral
              value: neutral
            - label: Ink
              value: ink
            - label: Accent
              value: accent
            - label: Gradient
              value: gradient
          defaultValue: neutral
          allowSetByMonitor: true
        - type: range
          key: panelBorder
          label: Panel edge strength
          min: 0
          max: 100
          step: 1
          defaultValue: 34
          allowSetByMonitor: true
        - type: switch
          key: borderAnimation
          label: Turn gradient edges
          description: Slowly rotates a gradient edge round each panel. Paused while windows cover the desktop.
          defaultValue: false
          allowSetByMonitor: true
        - type: select
          key: panelShadow
          label: Panel shadow
          options:
            - label: None
              value: none
            - label: Soft
              value: soft
            - label: Medium
              value: medium
            - label: Deep
              value: deep
            - label: Hard offset
              value: hard
            - label: Accent block
              value: block
            - label: Accent glow
              value: glow
          defaultValue: soft
          allowSetByMonitor: true
        - type: switch
          key: panelGlow
          label: Pointer light
          description: The light that follows the pointer across a panel.
          defaultValue: true
          allowSetByMonitor: true

  - group:
      label: Controls and icons
      items:
        - type: select
          key: controlShape
          label: Control shape
          description: How round every button, field, chip, switch and meter is, independent of the panel corners.
          options:
            - label: Square
              value: square
            - label: Subtle
              value: subtle
            - label: Rounded
              value: rounded
            - label: Round
              value: round
            - label: Pill
              value: pill
          defaultValue: rounded
          allowSetByMonitor: true
        - type: select
          key: density
          label: Density
          description: How much air every row, list and panel body carries.
          options:
            - label: Compact
              value: compact
            - label: Cosy
              value: cosy
            - label: Roomy
              value: roomy
          defaultValue: cosy
          allowSetByMonitor: true
        - type: range
          key: barThickness
          label: Meter thickness
          min: 2
          max: 14
          step: 1
          defaultValue: 4
          allowSetByMonitor: true
        - type: select
          key: barStyle
          label: Meter style
          options:
            - label: Solid
              value: solid
            - label: Gradient
              value: gradient
            - label: Striped
              value: striped
            - label: Glowing
              value: glow
          defaultValue: solid
          allowSetByMonitor: true
        - type: select
          key: scrollbars
          label: Scrollbars
          options:
            - label: Thin
              value: thin
            - label: Hidden
              value: hidden
            - label: Windows default
              value: auto
          defaultValue: thin
          allowSetByMonitor: true
        - type: range
          key: iconRadius
          label: Icon corner radius
          min: 0
          max: 24
          step: 1
          defaultValue: 10
          allowSetByMonitor: true
        - type: select
          key: iconLabelStyle
          label: Desktop icon labels
          options:
            - label: Shadowed
              value: shadow
            - label: On a pill
              value: pill
            - label: Plain
              value: plain
          defaultValue: shadow
          allowSetByMonitor: true

  - group:
      label: Motion
      items:
        - type: switch
          key: animations
          label: Animations
          defaultValue: true
        - type: range
          key: motionScale
          label: Animation length
          description: 100 is the tuned pace; 200 takes twice as long. Sent to the shell theme's Animation speed too.
          min: 25
          max: 200
          step: 5
          defaultValue: 100
          allowSetByMonitor: true
        - type: range
          key: staggerScale
          label: List stagger
          description: How far apart the rows of a list arrive. 0 brings a whole list in at once.
          min: 0
          max: 300
          step: 10
          defaultValue: 100
          allowSetByMonitor: true
        - type: select
          key: entranceStyle
          label: Panel entrance
          options:
            - label: Rise
              value: rise
            - label: Fade
              value: fade
            - label: Zoom
              value: zoom
            - label: Drop
              value: drop
            - label: Slide
              value: slide
            - label: Into focus
              value: blur
            - label: None
              value: none
          defaultValue: rise
          allowSetByMonitor: true

  - group:
      label: Advanced
      items:
        - type: switch
          key: styleShell
          label: Apply these to the Seelen shell
          description: >-
            Mirrors the font, text size, density, corner radius, blur, edge,
            animation length, list stagger and colour scheme settings into the
            "Desktop Surface" theme, so the dock, the start menu and every popup
            are dressed the same way. Needs that theme enabled. With the scheme
            on Follow Seelen theme no colour is sent - it travels the other way,
            from the theme's preset into this surface.
          defaultValue: true
        - type: text
          key: customCss
          label: Custom CSS
          description: >-
            A stylesheet of your own, applied after everything else. Easier to
            edit from the desktop's Appearance dialog (right-click the desktop),
            which previews as you type and lists every hook and token it can use.
          defaultValue: ""
          allowSetByMonitor: true

  - group:
      label: Wallpaper
      description: Backgrounds are chosen per monitor from the surface context menu.
      items:
        - type: switch
          key: wallpaperEnabled
          label: Enable wallpaper engine
          description: When off, the surface is transparent and Windows' own wallpaper shows through.
          defaultValue: true
          allowSetByMonitor: true
        - type: select
          key: wallpaperFit
          label: Fit
          options:
            - label: Cover
              value: cover
            - label: Contain
              value: contain
            - label: Fill
              value: fill
            - label: None
              value: none
          defaultValue: cover
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: range
          key: wallpaperBlur
          label: Blur
          min: 0
          max: 40
          step: 1
          defaultValue: 0
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: range
          key: wallpaperSaturation
          label: Saturation
          min: 0
          max: 200
          step: 5
          defaultValue: 100
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: range
          key: wallpaperBrightness
          label: Brightness
          min: 10
          max: 150
          step: 5
          defaultValue: 100
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: color
          key: wallpaperOverlayColor
          label: Tint colour
          defaultValue: "#000000"
          dependencies: [wallpaperEnabled]
        - type: range
          key: wallpaperOverlayOpacity
          label: Tint strength
          min: 0
          max: 100
          step: 1
          defaultValue: 0
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: switch
          key: wallpaperMuted
          label: Mute video wallpapers
          defaultValue: true
          dependencies: [wallpaperEnabled]
        - type: switch
          key: wallpaperPauseWhenCovered
          label: Pause video when covered
          description: Stops decoding while a window hides the desktop.
          defaultValue: true
          dependencies: [wallpaperEnabled]
        - type: switch
          key: slideshowEnabled
          label: Slideshow
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [wallpaperEnabled]
        - type: number
          key: slideshowInterval
          label: Slideshow interval (seconds)
          defaultValue: 300
          dependencies: [wallpaperEnabled, slideshowEnabled]
        - type: switch
          key: slideshowRandomize
          label: Shuffle slideshow
          defaultValue: true
          dependencies: [wallpaperEnabled, slideshowEnabled]

  - group:
      label: Modules
      items:
        - type: switch
          key: moduleClock
          label: Clock and calendar
          defaultValue: true
          allowSetByMonitor: true
        - type: switch
          key: moduleMedia
          label: Media and audio
          defaultValue: true
          allowSetByMonitor: true
        - type: switch
          key: moduleSysmon
          label: System monitor
          defaultValue: true
          allowSetByMonitor: true
        - type: switch
          key: moduleNotes
          label: Notes
          defaultValue: true
          allowSetByMonitor: true
        # Off by default: the desktop should not fill itself with panels the
        # first time the widget is installed. Each one is a click away in the
        # surface's own Modules menu.
        - type: switch
          key: moduleCalendar
          label: Calendar
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleWorldClock
          label: World clock
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleTimer
          label: Timer
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleBattery
          label: Battery
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: modulePower
          label: Power
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleQuick
          label: Quick settings
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleWindows
          label: Open windows
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleWorkspaces
          label: Workspaces
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleNetwork
          label: Network
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleBluetooth
          label: Bluetooth
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleNotifications
          label: Notifications
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleClipboard
          label: Clipboard history
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleTrash
          label: Recycle bin
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleFiles
          label: Files
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleGames
          label: Games
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleChat
          label: Assistant
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleWeather
          label: Weather
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleAgenda
          label: Agenda
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleAlarms
          label: Alarms, timers and stopwatch
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: modulePerf
          label: Performance
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleUsage
          label: Screen time
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleApps
          label: Apps
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleBoard
          label: Board
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleHabits
          label: Habits
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleCalc
          label: Calculator
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleTray
          label: Tray
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleLinks
          label: Links and search
          defaultValue: false
          allowSetByMonitor: true
        - type: switch
          key: moduleBrowser
          label: Browser
          defaultValue: false
          allowSetByMonitor: true

  # Every per-module option below is also reachable by right-clicking the module
  # itself on the surface, which writes back here. They are all
  # `allowSetByMonitor` so that "this display only" has somewhere to land.
  - group:
      label: Clock
      items:
        - type: switch
          key: clock24h
          label: 24-hour time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleClock]
        - type: switch
          key: clockShowSeconds
          label: Show seconds
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleClock]
        - type: switch
          key: clockShowDate
          label: Show date
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleClock]

  - group:
      label: Media
      items:
        - type: switch
          key: mediaShowArt
          label: Show album art
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleMedia]
        - type: switch
          key: mediaShowVisualiser
          label: Show visualiser
          description: Only drawn once the waveform stream carries real signal.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleMedia]
        - type: switch
          key: mediaShowMixer
          label: Show audio mixer
          description: Per-application volume, mute and output device.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleMedia]

  - group:
      label: System monitor
      items:
        - type: switch
          key: sysmonCpu
          label: CPU
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleSysmon]
        - type: switch
          key: sysmonRam
          label: Memory
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleSysmon]
        - type: switch
          key: sysmonDisk
          label: Disks
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleSysmon]
        - type: switch
          key: sysmonNet
          label: Network
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleSysmon]

  - group:
      label: Notes
      items:
        - type: select
          key: notesDefaultTab
          label: Opens on
          options:
            - label: Todo
              value: todo
            - label: Note
              value: note
          defaultValue: todo
          allowSetByMonitor: true
          dependencies: [moduleNotes]
        - type: switch
          key: notesHideCompleted
          label: Hide completed tasks
          description: They are kept, just not listed.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleNotes]

  - group:
      label: Calendar
      items:
        - type: switch
          key: calendarStartMonday
          label: Weeks start on Monday
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleCalendar]
        - type: switch
          key: calendarWeekNumbers
          label: Show week numbers
          description: ISO-8601 weeks, in a column down the left.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleCalendar]
        - type: switch
          key: calendarHighlightWeekend
          label: Mute weekends
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleCalendar]

  - group:
      label: World clock
      items:
        - type: text
          key: worldClockZones
          label: Time zones
          description: IANA names separated by commas, e.g. Europe/London, Asia/Tokyo.
          defaultValue: "UTC, Europe/London, America/New_York, Asia/Tokyo"
          allowSetByMonitor: true
          dependencies: [moduleWorldClock]
        - type: switch
          key: worldClock24h
          label: 24-hour time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWorldClock]
        - type: switch
          key: worldClockOffsets
          label: Show offset from this machine
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWorldClock]

  - group:
      label: Timer
      items:
        - type: range
          key: timerWorkMinutes
          label: Focus length (minutes)
          min: 1
          max: 120
          step: 1
          defaultValue: 25
          allowSetByMonitor: true
          dependencies: [moduleTimer]
        - type: range
          key: timerBreakMinutes
          label: Break length (minutes)
          min: 1
          max: 60
          step: 1
          defaultValue: 5
          allowSetByMonitor: true
          dependencies: [moduleTimer]
        - type: switch
          key: timerChime
          label: Chime when it ends
          description: Two short tones, played through the default output.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleTimer]
        - type: switch
          key: timerAutoContinue
          label: Start the next phase automatically
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleTimer]

  - group:
      label: Battery
      description: A machine with no battery shows its mains and power-plan state instead.
      items:
        - type: switch
          key: batteryShowRate
          label: Show power draw
          description: Watts in or out, while the battery is not idle.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBattery]
        - type: switch
          key: batteryShowHealth
          label: Show health
          description: Full charge as a share of the design capacity.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleBattery]
        - type: switch
          key: batteryShowPowerMode
          label: Show power mode
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBattery]

  - group:
      label: Power
      items:
        - type: switch
          key: powerConfirm
          label: Confirm before ending the session
          description: Sign out, restart and shut down ask twice.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePower]
        - type: switch
          key: powerShowSleep
          label: Show sleep
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePower]
        - type: switch
          key: powerShowHibernate
          label: Show hibernate
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [modulePower]
        - type: switch
          key: powerShowShutdown
          label: Show restart and shut down
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePower]

  - group:
      label: Quick settings
      items:
        - type: switch
          key: quickBrightness
          label: Brightness
          description: Only monitors that answer a brightness request appear.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleQuick]
        - type: switch
          key: quickRadios
          label: Wi-Fi and bluetooth switches
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleQuick]
        - type: switch
          key: quickFocusAssist
          label: Focus assist
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleQuick]

  - group:
      label: Open windows
      items:
        - type: switch
          key: windowsThisDisplayOnly
          label: Only windows on this display
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWindows]
        - type: switch
          key: windowsGroupByApp
          label: Group by application
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleWindows]
        - type: switch
          key: windowsHideMinimised
          label: Hide minimised windows
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleWindows]
        - type: switch
          key: windowsShowIcons
          label: Show icons
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWindows]

  - group:
      label: Workspaces
      description: Seelen's virtual desktops are per monitor, so each display lists its own.
      items:
        - type: switch
          key: workspacesShowNames
          label: Show names
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWorkspaces]
        - type: switch
          key: workspacesShowCounts
          label: Show window counts
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWorkspaces]
        - type: switch
          key: workspacesShowControls
          label: Allow editing
          description: Adds, renames and removes desktops from the panel.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWorkspaces]

  - group:
      label: Network
      items:
        - type: switch
          key: networkShowWifi
          label: Show wireless networks
          description: Scans when the panel appears, and whenever you press Scan.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleNetwork]
        - type: switch
          key: networkShowIp
          label: Show local address
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleNetwork]
        - type: switch
          key: networkShowAdapters
          label: Show adapters
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleNetwork]

  - group:
      label: Bluetooth
      description: Pairing stays in Windows Settings; the host exposes no pin exchange.
      items:
        - type: switch
          key: bluetoothPairedOnly
          label: Only paired devices
          description: Turn off to also list whatever a scan finds nearby.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBluetooth]
        - type: switch
          key: bluetoothShowRadio
          label: Show the bluetooth switch
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBluetooth]

  - group:
      label: Notifications
      items:
        - type: switch
          key: notificationsShowBody
          label: Show message text
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleNotifications]
        - type: switch
          key: notificationsShowApp
          label: Show app and time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleNotifications]
        - type: switch
          key: notificationsShowControls
          label: Show focus assist
          description: The switch, and what still gets through while it is on.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleNotifications]
        - type: range
          key: notificationsMax
          label: How many to list
          min: 3
          max: 40
          step: 1
          defaultValue: 8
          allowSetByMonitor: true
          dependencies: [moduleNotifications]

  - group:
      label: Clipboard history
      description: Windows keeps the history; turn it on with Win+V if the panel says it is off.
      items:
        - type: switch
          key: clipboardPasteOnClick
          label: Paste on click
          description: Otherwise a click only puts the entry back on the clipboard.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleClipboard]
        - type: switch
          key: clipboardShowImages
          label: Show image previews
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleClipboard]
        - type: switch
          key: clipboardShowSource
          label: Show source app and time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleClipboard]
        - type: range
          key: clipboardMax
          label: How many to list
          min: 3
          max: 50
          step: 1
          defaultValue: 15
          allowSetByMonitor: true
          dependencies: [moduleClipboard]

  - group:
      label: Files
      items:
        - type: select
          key: filesFolder
          label: Folder
          description: Where browsing starts. Subfolders are opened in the panel.
          options:
            - label: Recent
              value: Recent
            - label: Downloads
              value: Downloads
            - label: Documents
              value: Documents
            - label: Pictures
              value: Pictures
            - label: Music
              value: Music
            - label: Videos
              value: Videos
            - label: Desktop
              value: Desktop
          defaultValue: Recent
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: select
          key: filesView
          label: View
          options:
            - label: List
              value: list
            - label: Tiles
              value: grid
          defaultValue: list
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: range
          key: filesTileSize
          label: Tile size
          description: Tiles view only.
          min: 40
          max: 140
          step: 4
          defaultValue: 64
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: select
          key: filesSort
          label: Order
          description: Folders always come first.
          options:
            - label: Name
              value: name
            - label: Type
              value: type
          defaultValue: name
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: switch
          key: filesShowSearch
          label: Show the filter box
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: range
          key: filesMax
          label: How many to list
          min: 5
          max: 200
          step: 5
          defaultValue: 30
          allowSetByMonitor: true
          dependencies: [moduleFiles]
        - type: switch
          key: filesShowIcons
          label: Show icons
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleFiles]

  - group:
      label: Recycle bin
      items:
        - type: switch
          key: trashConfirmEmpty
          label: Confirm before emptying
          description: Emptying the bin cannot be undone.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleTrash]

  - group:
      label: Games
      description: >-
        Games are found three ways: the Start Menu index, a walk of the folders
        downloads land in, and whatever is seen running.
      items:
        - type: switch
          key: gamesAutoDetect
          label: Find games automatically
          description: Matches the Start Menu index against each store's own shortcuts.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesDeepScan
          label: Search Downloads, Desktop and Documents
          description: >-
            Recognises a game by the engine and store files that shipped with it,
            which is what finds one that came from the web rather than a store.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesScanRunning
          label: Add games when they are played
          description: >-
            Anything running from a game library is added, which is the only way
            to see a Game Pass title.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesTrackPlaytime
          label: Track play time
          description: Timed from the game's own window, and only while the panel is shown.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: select
          key: gamesLayout
          label: Layout
          options:
            - label: Grid
              value: grid
            - label: Shelf
              value: shelf
            - label: List
              value: list
          defaultValue: grid
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: range
          key: gamesTileSize
          label: Tile size
          min: 48
          max: 200
          step: 4
          defaultValue: 72
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: select
          key: gamesArtShape
          label: Art shape
          options:
            - label: Square
              value: square
            - label: Box art (2:3)
              value: portrait
            - label: Capsule (16:9)
              value: wide
          defaultValue: square
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: select
          key: gamesArtStyle
          label: Art
          description: Cover images you choose are used whatever this is set to.
          options:
            - label: Gradient and icon
              value: auto
            - label: Icon only
              value: icon
            - label: Initials
              value: plain
          defaultValue: auto
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: select
          key: gamesLabelMode
          label: Titles
          options:
            - label: Always
              value: always
            - label: On hover
              value: hover
            - label: Never
              value: never
          defaultValue: always
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: select
          key: gamesSort
          label: Order
          options:
            - label: Recently played
              value: recent
            - label: Most played
              value: played
            - label: Name
              value: name
            - label: Store
              value: launcher
          defaultValue: recent
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesFavouritesFirst
          label: Favourites first
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesGroupByLauncher
          label: Group by store
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesShowSearch
          label: Show the search box
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesShowLauncher
          label: Show the store badge
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesShowRunning
          label: Mark games that are running
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesShowStats
          label: Show play time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesHoverZoom
          label: Lift the art on hover
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleGames]
        - type: switch
          key: gamesShowMissing
          label: Show uninstalled games
          description: Entries a rescan no longer finds, kept for their play time.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleGames]

  # Game mode turns one display's desktop into a console-style launcher. Its
  # settings are deliberately *not* allowSetByMonitor: only one display can be
  # the launcher, so a per-display value would only be a way for two replicas
  # to disagree about which of them that is.
  - group:
      label: Game mode
      description: >-
        Turns one display's desktop into a full-screen game launcher driven by a
        controller. Open it from the desktop's own menu, or from the command
        palette on Win+Alt+Space.
      items:
        - type: text
          key: gameModeDisplay
          label: Display
          description: >-
            The monitor id to take over; blank uses the primary display. The
            desktop's Game mode menu lists the displays by name, which is easier
            than copying an id in here.
          defaultValue: ""
        - type: switch
          key: gameModeAtStart
          label: Open game mode at start-up
          description: That display comes up as the launcher rather than as a desktop.
          defaultValue: false
        - type: select
          key: gameModeOnLaunch
          label: When a game starts
          options:
            - label: Leave the launcher open
              value: stay
            - label: Go back to the desktop
              value: leave
          defaultValue: stay
        - type: switch
          key: gameModeKeepFocus
          label: Keep the keyboard
          description: >-
            A controller can only be read while this display holds the keyboard,
            so letting go turns the pad off.
          defaultValue: true
        - type: switch
          key: gameModeHideCursor
          label: Hide the mouse pointer
          defaultValue: true
        - type: switch
          key: gameModeAnimate
          label: Animate
          defaultValue: true

  - group:
      label: Game mode - library
      items:
        - type: select
          key: gameModeSort
          label: Order
          options:
            - label: Recently played
              value: recent
            - label: Name
              value: name
            - label: Most played
              value: played
            - label: Store
              value: launcher
          defaultValue: recent
        - type: switch
          key: gameModeFavouritesFirst
          label: Favourites first
          defaultValue: true
        - type: range
          key: gameModeRecentCount
          label: Games on the home row
          min: 4
          max: 30
          step: 1
          defaultValue: 12
        - type: switch
          key: gameModeShowSearch
          label: Show the search row
          defaultValue: true
        - type: switch
          key: gameModeShowStats
          label: Show play time
          defaultValue: true
        - type: switch
          key: gameModeShowBlurb
          label: Show descriptions
          description: >-
            The one-line descriptions written by a model. Nothing is shown until
            you ask for them to be written, in the desktop's Game mode dialog.
          defaultValue: true
        - type: switch
          key: gameModeShowApps
          label: Show the Apps section
          description: The desktop icons, as a grid that can be started from the sofa.
          defaultValue: true
        - type: switch
          key: gameModeShowPower
          label: Show the Power section
          defaultValue: true

  - group:
      label: Game mode - look
      items:
        - type: select
          key: gameModeLayout
          label: Layout
          options:
            - label: Shelves - rows that scroll sideways
              value: shelf
            - label: Grid - everything at once
              value: grid
            - label: Wall - large covers, few of them
              value: wall
          defaultValue: shelf
        - type: range
          key: gameModeTileSize
          label: Tile size
          min: 120
          max: 400
          step: 10
          defaultValue: 200
        - type: select
          key: gameModeArtShape
          label: Tile shape
          options:
            - label: Square
              value: square
            - label: Portrait
              value: portrait
            - label: Wide
              value: wide
          defaultValue: square
        - type: select
          key: gameModeArtStyle
          label: On each tile
          description: >-
            Every tile is the same surface - the panel material the rest of the
            desktop is made of - and this is what sits on it.
          options:
            - label: The application's icon
              value: icon
            - label: A cover image, where there is one
              value: cover
            - label: The title only
              value: plain
          defaultValue: icon
        - type: select
          key: gameModeBackdrop
          label: Backdrop
          options:
            - label: The wallpaper
              value: wallpaper
            - label: The selected game's cover, if it has one
              value: art
            - label: Plain
              value: plain
          defaultValue: wallpaper
        - type: range
          key: gameModeBackdropDim
          label: Backdrop dim
          min: 0
          max: 95
          step: 1
          defaultValue: 62
        - type: range
          key: gameModeBackdropBlur
          label: Backdrop blur
          min: 0
          max: 120
          step: 2
          defaultValue: 40
        - type: switch
          key: gameModeShowHero
          label: Show the details panel
          defaultValue: true
        - type: switch
          key: gameModeShowClock
          label: Show the clock
          defaultValue: true
        - type: switch
          key: gameModeShowLegend
          label: Show the button hints
          defaultValue: true

  # A controller is read through the browser's Gamepad API, which only reports
  # while the surface holds the keyboard - so these settings do nothing at all
  # until game mode is open, or "drive the desktop" below is switched on.
  - group:
      label: Controller
      description: >-
        How a gamepad is read. Buttons are named by position - south, east,
        west, north - so one set of bindings is correct on an Xbox pad, a
        DualSense and a Switch Pro controller alike.
      items:
        - type: switch
          key: padEnabled
          label: Read the controller
          description: Off, game mode still works with the keyboard and the mouse.
          defaultValue: true
        - type: select
          key: padLayout
          label: Button glyphs
          options:
            - label: Detect from the pad
              value: auto
            - label: Xbox
              value: xbox
            - label: PlayStation
              value: playstation
            - label: Nintendo
              value: nintendo
            - label: Generic
              value: generic
          defaultValue: auto
        - type: range
          key: padDeadzone
          label: Stick dead zone
          min: 0
          max: 60
          step: 1
          defaultValue: 25
        - type: range
          key: padCurve
          label: Stick response
          description: 100 is linear; higher gives finer control near the centre.
          min: 100
          max: 300
          step: 5
          defaultValue: 160
        - type: switch
          key: padStickNavigates
          label: The left stick moves the selection
          defaultValue: true
        - type: range
          key: padStickThreshold
          label: Stick step point
          min: 20
          max: 95
          step: 1
          defaultValue: 55
        - type: range
          key: padRepeatDelay
          label: Hold before repeating
          min: 150
          max: 900
          step: 10
          defaultValue: 420
        - type: range
          key: padRepeatInterval
          label: Repeat every
          min: 40
          max: 400
          step: 5
          defaultValue: 140
        - type: range
          key: padRepeatMin
          label: Fastest repeat
          description: A long hold accelerates from the rate above to this one.
          min: 20
          max: 300
          step: 5
          defaultValue: 60
        - type: range
          key: padTriggerThreshold
          label: Trigger pull
          min: 5
          max: 95
          step: 1
          defaultValue: 50
        - type: switch
          key: padRumble
          label: Rumble
          defaultValue: true
        - type: range
          key: padRumbleStrength
          label: Rumble strength
          min: 0
          max: 100
          step: 5
          defaultValue: 35
        - type: text
          key: padBindings
          label: Button bindings
          description: >-
            One action=button per line or separated by commas, for example
            "confirm=south, back=east". Blank uses the console default.
          defaultValue: ""

  - group:
      label: Controller on the desktop
      description: >-
        Outside game mode, a controller can drive the surface itself: buttons
        become keys, clicks and scrolling, and the right stick becomes a
        pointer. It reaches this desktop only - synthesising input for a game or
        another application needs a Win32 call the host exposes no command for.
      items:
        - type: switch
          key: padDesktop
          label: Drive the desktop with the controller
          defaultValue: false
        - type: select
          key: padPreset
          label: Button profile
          options:
            - label: Menu navigation
              value: navigation
            - label: Arrow keys
              value: arrows
            - label: WASD
              value: wasd
            - label: Mouse and scroll
              value: mouse
            - label: Custom
              value: custom
          defaultValue: navigation
        - type: text
          key: padCustomKeys
          label: Button overrides
          description: >-
            Applied over the profile, for example "north=f5, l3=click". A value
            may be a key, click, rightclick, middleclick, scrollup, scrolldown,
            or none.
          defaultValue: ""
        - type: switch
          key: padPointer
          label: The right stick moves a pointer
          defaultValue: true
        - type: range
          key: padPointerSpeed
          label: Pointer speed
          min: 200
          max: 3000
          step: 50
          defaultValue: 1100
        - type: range
          key: padPointerAccel
          label: Pointer ramp
          min: 100
          max: 400
          step: 10
          defaultValue: 190
        - type: range
          key: padPointerSize
          label: Pointer size
          min: 10
          max: 60
          step: 1
          defaultValue: 22
        - type: range
          key: padPointerHide
          label: Fade the pointer after
          description: 0 keeps it on screen.
          min: 0
          max: 20
          step: 1
          defaultValue: 3
        - type: switch
          key: padStickScrolls
          label: The left stick scrolls
          defaultValue: true
        - type: range
          key: padScrollSpeed
          label: Scroll speed
          min: 2
          max: 60
          step: 1
          defaultValue: 14

  # The API key is deliberately absent from this file. Settings live in
  # Seelen's own settings store, which is shared, exportable and per-monitor
  # patchable; a credential belongs in none of those. The panel asks for it
  # and keeps it in the widget's data directory instead.
  - group:
      label: Assistant
      items:
        - type: select
          key: chatProvider
          label: Service
          description: The API key is asked for in the panel itself.
          options:
            - label: Ollama (local)
              value: ollama
            - label: Gemini
              value: gemini
            - label: OpenAI
              value: openai
            - label: Claude
              value: anthropic
            - label: OpenRouter
              value: openrouter
            - label: Groq
              value: groq
            - label: LM Studio (local)
              value: lmstudio
            - label: Custom endpoint
              value: custom
          defaultValue: ollama
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: text
          key: chatModel
          label: Model
          description: Leave blank for the service's own default.
          defaultValue: ""
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: switch
          key: chatRouting
          label: Choose the model per question
          description: >-
            Keeps questions about this PC local, sends harder ones to the
            strongest service you have a key for, and moves on when one is rate
            limited or down.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: switch
          key: chatTools
          label: Let it use this PC
          description: >-
            Works as an agent: reads and controls apps, windows, media, devices,
            files, notes and the web. Which of those, and when it asks first,
            is set in the assistant's own settings (the gear in its panel).
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: switch
          key: chatContext
          label: Send a status summary
          description: >-
            Puts the time, load, battery and open apps at the top of every turn
            so it does not have to ask. Sent to whichever service answers.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: text
          key: chatSystemPrompt
          label: System prompt
          description: Sets the tone for every reply.
          defaultValue: "Be concise and direct. Use Markdown only where it helps."
          allowSetByMonitor: true
          dependencies: [moduleChat]
        - type: switch
          key: chatStream
          label: Stream replies
          description: Shows the answer as it is written instead of all at once.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleChat]

  - group:
      label: Weather
      description: Forecasts from Open-Meteo, fetched every thirty minutes while the panel is shown.
      items:
        - type: text
          key: weatherPlace
          label: Place
          description: A city or town. Searching from the panel itself picks the exact one.
          defaultValue: ""
          allowSetByMonitor: true
          dependencies: [moduleWeather]
        - type: select
          key: weatherUnits
          label: Units
          options:
            - label: Metric (°C, km/h)
              value: metric
            - label: Imperial (°F, mph)
              value: imperial
          defaultValue: metric
          allowSetByMonitor: true
          dependencies: [moduleWeather]
        - type: range
          key: weatherDays
          label: Days ahead
          min: 3
          max: 14
          step: 1
          defaultValue: 7
          allowSetByMonitor: true
          dependencies: [moduleWeather]
        - type: switch
          key: weatherShowHourly
          label: Show the next 24 hours
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWeather]
        - type: switch
          key: weatherShowDetails
          label: Show the details
          description: Humidity, wind, UV, rain, sunrise and sunset.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleWeather]

  - group:
      label: Agenda
      description: Events and reminders, shared by every display.
      items:
        - type: range
          key: agendaDaysAhead
          label: Look ahead (days)
          min: 1
          max: 60
          step: 1
          defaultValue: 14
          allowSetByMonitor: true
          dependencies: [moduleAgenda]
        - type: switch
          key: agendaShowWeek
          label: Show the week strip
          description: Seven days across the top, with a dot on each day something is on.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleAgenda]
        - type: switch
          key: agendaReminders
          label: Ring reminders
          description: While an Agenda panel is on any display. Only one display rings, however many show it.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleAgenda]
        - type: select
          key: agendaDefaultRemind
          label: Default reminder
          options:
            - label: None
              value: none
            - label: At the start
              value: "0"
            - label: 5 minutes before
              value: "5"
            - label: 10 minutes before
              value: "10"
            - label: 15 minutes before
              value: "15"
            - label: 30 minutes before
              value: "30"
            - label: 1 hour before
              value: "60"
          defaultValue: "10"
          allowSetByMonitor: true
          dependencies: [moduleAgenda]
        - type: switch
          key: agendaMonthFirst
          label: Read 3/10 as 10 March
          description: For dates typed with a slash. Dates with dots are always day first.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleAgenda]

  - group:
      label: Alarms
      items:
        - type: select
          key: alarmsDefaultTab
          label: Opens on
          options:
            - label: Timers
              value: timers
            - label: Stopwatch
              value: stopwatch
            - label: Alarms
              value: alarms
          defaultValue: timers
          allowSetByMonitor: true
          dependencies: [moduleAlarms]
        - type: range
          key: alarmsRings
          label: Rings
          description: How many times a finished timer or an alarm chimes before it goes quiet.
          min: 1
          max: 20
          step: 1
          defaultValue: 6
          allowSetByMonitor: true
          dependencies: [moduleAlarms]
        - type: range
          key: alarmsVolume
          label: Volume
          min: 5
          max: 100
          step: 5
          defaultValue: 60
          allowSetByMonitor: true
          dependencies: [moduleAlarms]
        - type: switch
          key: alarms24h
          label: 24-hour time
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleAlarms]

  - group:
      label: Performance
      items:
        - type: select
          key: perfDefaultTab
          label: Opens on
          options:
            - label: CPU
              value: cpu
            - label: Memory
              value: memory
            - label: Disk
              value: disk
            - label: Network
              value: network
          defaultValue: cpu
          allowSetByMonitor: true
          dependencies: [modulePerf]
        - type: switch
          key: perfShowCores
          label: Show every core
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePerf]
        - type: switch
          key: perfFillGraph
          label: Fill under the graph
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePerf]
        - type: switch
          key: perfShowGrid
          label: Show guide lines
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [modulePerf]

  - group:
      label: Screen time
      description: Counted from the foreground window while the panel is on some display, by one display only.
      items:
        - type: range
          key: usageIdleMinutes
          label: Away after (minutes)
          description: No pointer movement and no change of window for this long stops the count. A fullscreen window never counts as away.
          min: 1
          max: 30
          step: 1
          defaultValue: 5
          allowSetByMonitor: true
          dependencies: [moduleUsage]
        - type: switch
          key: usageShowWeek
          label: Show the week
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleUsage]
        - type: range
          key: usageMax
          label: Apps to list
          min: 3
          max: 25
          step: 1
          defaultValue: 8
          allowSetByMonitor: true
          dependencies: [moduleUsage]
        - type: text
          key: usageIgnore
          label: Never count
          description: Application names separated by commas.
          defaultValue: ""
          allowSetByMonitor: true
          dependencies: [moduleUsage]

  - group:
      label: Apps
      items:
        - type: select
          key: appsView
          label: View
          options:
            - label: List
              value: list
            - label: Tiles
              value: grid
          defaultValue: list
          allowSetByMonitor: true
          dependencies: [moduleApps]
        - type: range
          key: appsTileSize
          label: Tile size
          description: Tiles view only.
          min: 32
          max: 96
          step: 4
          defaultValue: 48
          allowSetByMonitor: true
          dependencies: [moduleApps]
        - type: switch
          key: appsShowFavourites
          label: Show favourites
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleApps]
        - type: switch
          key: appsShowRecent
          label: Show recently opened
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleApps]
        - type: switch
          key: appsShowAll
          label: List every app
          description: Otherwise the full list only appears while searching.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleApps]

  - group:
      label: Board
      items:
        - type: range
          key: boardColumnWidth
          label: Column width
          min: 140
          max: 360
          step: 10
          defaultValue: 200
          allowSetByMonitor: true
          dependencies: [moduleBoard]
        - type: switch
          key: boardShowDue
          label: Show due dates
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBoard]
        - type: switch
          key: boardShowNotes
          label: Show the first line of notes
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBoard]
        - type: switch
          key: boardCompact
          label: Compact cards
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleBoard]

  - group:
      label: Habits
      items:
        - type: range
          key: habitsDays
          label: Days shown
          min: 5
          max: 14
          step: 1
          defaultValue: 7
          allowSetByMonitor: true
          dependencies: [moduleHabits]
        - type: switch
          key: habitsShowStreak
          label: Show streaks
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleHabits]
        - type: switch
          key: habitsShowHeatmap
          label: Show the history
          description: Sixteen weeks for the habit you select.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleHabits]

  - group:
      label: Calculator
      items:
        - type: switch
          key: calcShowKeypad
          label: Show the keypad
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleCalc]
        - type: select
          key: calcAngle
          label: Angles
          options:
            - label: Degrees
              value: deg
            - label: Radians
              value: rad
          defaultValue: deg
          allowSetByMonitor: true
          dependencies: [moduleCalc]
        - type: range
          key: calcPrecision
          label: Significant digits
          min: 4
          max: 16
          step: 1
          defaultValue: 10
          allowSetByMonitor: true
          dependencies: [moduleCalc]
        - type: switch
          key: calcGrouping
          label: Group thousands
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleCalc]

  - group:
      label: Tray
      items:
        - type: range
          key: trayIconSize
          label: Icon size
          min: 16
          max: 40
          step: 2
          defaultValue: 24
          allowSetByMonitor: true
          dependencies: [moduleTray]
        - type: switch
          key: trayShowLabels
          label: List with names
          description: Each icon beside its tooltip, instead of a grid of icons.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleTray]
        - type: switch
          key: trayShowHidden
          label: Include hidden icons
          description: The ones Windows keeps behind the overflow arrow.
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleTray]

  - group:
      label: Links
      items:
        - type: select
          key: linksEngine
          label: Search with
          description: "Bangs pick another for one search: !g, !ddg, !yt, !gh, !w, !maps."
          options:
            - label: Google
              value: google
            - label: DuckDuckGo
              value: duckduckgo
            - label: Bing
              value: bing
            - label: Brave
              value: brave
            - label: Startpage
              value: startpage
            - label: Ecosia
              value: ecosia
            - label: Kagi
              value: kagi
          defaultValue: google
          allowSetByMonitor: true
          dependencies: [moduleLinks]
        - type: switch
          key: linksShowSearch
          label: Show the search box
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleLinks]
        - type: switch
          key: linksShowLabels
          label: Show names
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleLinks]
        - type: range
          key: linksTileSize
          label: Tile size
          min: 32
          max: 96
          step: 4
          defaultValue: 44
          allowSetByMonitor: true
          dependencies: [moduleLinks]

  - group:
      label: Browser
      description: >-
        A page in a panel. A site that refuses to be shown inside another page is
        shown as a copy rendered by r.jina.ai - its look, without its scripts - or
        opens in a window of its own.
      items:
        - type: switch
          key: browserReader
          label: Open pages as text
          description: Every page as plain text, read through r.jina.ai.
          defaultValue: false
          allowSetByMonitor: true
          dependencies: [moduleBrowser]
        - type: switch
          key: browserShowNav
          label: Show back and forward
          defaultValue: true
          allowSetByMonitor: true
          dependencies: [moduleBrowser]
        - type: range
          key: browserZoom
          label: Page zoom
          min: 50
          max: 150
          step: 10
          defaultValue: 100
          allowSetByMonitor: true
          dependencies: [moduleBrowser]
