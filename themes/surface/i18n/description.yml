en: Dresses Seelen's own shell - dock, toolbar, start menu, app switcher, popups and menus - in the same glass, radius and row chrome as the @ralfm/desktop surface.
de: Kleidet Seelens eigene Shell - Dock, Symbolleiste, Startmenü, App-Umschalter, Popups und Menüs - in dasselbe Glas, dieselben Radien und dieselbe Zeilenoptik wie die @ralfm/desktop-Oberfläche.
